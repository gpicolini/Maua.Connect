spring.application.name=hub
server.port=8082

# MONGO DB AQUI EM BAIXO
spring.mongodb.uri=${MONGODB_URI}

# SQL SERVER AQUI EM BAIXO
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:sqlserver://${DB_SQLSERVER_HOST}:${DB_SQLSERVER_PORT};databaseName=${DB_NAME};encrypt=${DB_ENCRYPT};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE};integratedSecurity=${DB_INTEGRATED_SECURITY}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver