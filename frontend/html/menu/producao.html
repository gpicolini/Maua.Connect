<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Prótese | AACD</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="../../css/menu/painel.css">
    <link rel="stylesheet" href="../../css/menu/producao.css">
    <link rel="icon" href="../../imagens/inicio/logos/loguinho-aacd-barra.png">
</head>

<body>

   <div class="background">

         <header class="cabecalho">
            <div class="retanguloFifa">
                <div class="perfilInformacoes">
                    <strong>Olá, [Nome do Usuário]</strong>
                    <span>Medico</span>
                </div>
                <div class="perfilPonta">MD</div>
            </div>

            <div class="acoesPerfil">
                <img class="logoInstituicao" src="../../imagens/menu/logos/logo-aacd-branco.png" alt="Logo da AACD">
                <img class="logoMaua" src="../../imagens/menu/logos/logo-maua.svg"
                    alt="Logo do Instituto Mauá de Tecnologia">
            </div>

        </header>


            <nav class="barradomenu" aria-label="Menu principal">
                <a class="aba" href="central.html">Central</a>
                <a class="aba" href="demandas.html">Demandas</a>
                <a class="aba" href="impressoras.html">Impressoras</a>
                <a class="aba ativa" href="producao.html" aria-current="page">Produção</a>
                <a class="aba" href="historico.html">Histórico</a>
            </nav>

            <main class="cartao">
                <div class="cartaoTopo">
                    <svg viewBox="0 0 64 64" fill="white" aria-hidden="true">
                        <path d="M24 4h18v6c0 4-2 8-4 12l-3 14v8h-9v-8l-1-16c-1-4-1-8-1-12z" />
                        <path d="M26 46h10l2 6h10a4 4 0 0 1 0 8H18a4 4 0 0 1-4-4c0-3 3-5 6-6z" />
                    </svg>
                    <h1>Solicitar Prótese</h1>
                </div>

                <div class="cartaoCorpo">
                    <p class="subtitulo">Preencha os dados da prótese desejada para solicitar a impressão.</p>

                    <form class="formularioProtese" id="formSolicitarProtese" novalidate>
                        <div class="campo">
                            <label for="categoria">Categoria da prótese<span class="obrigatorio">*</span></label>
                            <select class="selecao" id="categoria" name="categoria" required>
                                <option value="" selected disabled>Selecione uma categoria</option>
                                <option value="TRANSFEMORAL">Transfemoral</option>
                                <option value="TRANSTIBIAL">Transtibial</option>
                                <option value="MEMBRO_SUPERIOR">Membro superior</option>
                                <option value="MAO_DEDOS">Mão / dedos</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="tipo">Tipo de prótese<span class="obrigatorio">*</span></label>
                            <select class="selecao" id="tipo" name="tipo" required>
                                <option value="" selected disabled>Selecione o tipo</option>
                                <option value="MODULAR">Prótese Modular</option>
                                <option value="DEFINITIVA">Prótese Definitiva</option>
                                <option value="PARCIAL">Prótese Parcial</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="lado">Lado de uso<span class="obrigatorio">*</span></label>
                            <select class="selecao" id="lado" name="lado" required>
                                <option value="" selected disabled>Selecione o lado</option>
                                <option value="DIREITO">Direito</option>
                                <option value="ESQUERDO">Esquerdo</option>
                                <option value="BILATERAL">Bilateral</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="faixaEtaria">Faixa etária indicada<span class="obrigatorio">*</span></label>
                            <select class="selecao" id="faixaEtaria" name="faixaEtaria" required>
                                <option value="" selected disabled>Selecione a faixa etária</option>
                                <option value="INFANTIL">Infantil (0 a 12 anos)</option>
                                <option value="ADOLESCENTE">Adolescente (13 a 17 anos)</option>
                                <option value="ADULTO">Adulto (18 a 59 anos)</option>
                                <option value="IDOSO">Idoso (60+ anos)</option>
                            </select>
                        </div>

                        <div class="campo campoInteiro">
                            <label for="descricao">Descrição da prótese<span class="obrigatorio">*</span></label>
                            <textarea class="areaTexto" id="descricao" name="descricao" maxlength="500" required
                                placeholder="Descreva o objetivo, funcionalidades e características principais da prótese..."></textarea>
                            <span class="contadorCaracteres" id="contadorDescricao">0/500</span>
                        </div>

                        <div class="acoesFormulario">
                            <p class="mensagem" id="mensagemSolicitacao" role="status"></p>
                            <button class="botaoPrincipal" type="submit">
                                Finalizar Pedido
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="m9 6 6 6-6 6" />
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </main>

        
    </div>

    <script src="../../js/menu/producao.js"></script>
</body>

</html>
