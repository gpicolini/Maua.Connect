<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filtros de Demandas | AACD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />

  <link rel="stylesheet" href="../../css/menu/tela-funcao.css">
  <link rel="stylesheet" href="../../css/menu/demandas-filtros.css">
  <link rel="icon" href="../../imagens/inicio/logos/loguinho-aacd-barra.png">
</head>

<body>
  <main class="card">
    <a href="demandas.html" class="voltar">← Voltar às demandas</a>

    <header class="cabecalho">
      <div class="logos">
        <img class="aacd" src="../../imagens/menu/logos/logo-aacd-branco.png" alt="AACD" />
        <span class="divisor"></span>
        <img class="maua" src="../../imagens/inicio/logos/logo-maua.svg" alt="Instituto Mauá de Tecnologia" />
      </div>
      <span class="tag">DEMANDAS</span>
      <h1>Filtros</h1>
      <p>Refine sua busca pelas demandas:</p>
    </header>

    <form id="form-filtros">
      <fieldset>
        <legend>BUSCA</legend>

        <div class="linha">
          <div>
            <label for="periodo">Período</label>
            <select id="periodo">
              <option value="">Selecione um período</option>
              <option value="7">Últimos 7 dias</option>
              <option value="30">Últimos 30 dias</option>
              <option value="90">Últimos 3 meses</option>
              <option value="custom">Personalizado</option>
            </select>
            <div class="periodo-custom" id="periodo-custom">
              <input type="date" id="data-inicio" aria-label="Data inicial" />
              <input type="date" id="data-fim" aria-label="Data final" />
            </div>
          </div>

          <div>
            <label for="categoria">Categoria da demanda</label>
            <select id="categoria">
              <option value="">Selecione uma categoria</option>
              <option value="Prótese Modular">Prótese modular</option>
              <option value="Prótese Definitiva">Prótese definitiva</option>
              <option value="Prótese Parcial">Prótese parcial</option>
              <option value="Órtese">Órtese</option>
              <option value="Adaptador">Adaptador</option>
            </select>
          </div>
        </div>

        <span class="rotulo">Status</span>
        <div class="chips">
          <input type="radio" name="status" id="st-todos" value="" checked /><label for="st-todos">Todos</label>
          <input type="radio" name="status" id="st-pendente" value="Pendente" /><label
            for="st-pendente">Pendente</label>
          <input type="radio" name="status" id="st-producao" value="Em Produção" /><label for="st-producao">Em
            produção</label>
          <input type="radio" name="status" id="st-concluida" value="Concluída" /><label
            for="st-concluida">Concluída</label>
          <input type="radio" name="status" id="st-cancelada" value="Cancelada" /><label
            for="st-cancelada">Cancelada</label>
        </div>

        <label for="solicitante">Solicitante</label>
        <div class="busca">
          <i class="ti ti-search"></i>
          <input type="text" id="solicitante" placeholder="Nome da pessoa ou instituição" />
        </div>
      </fieldset>

      <div class="botoes">
        <button type="submit" class="btn-aplicar">Aplicar filtros</button>
        <button type="button" class="btn-limpar" id="limpar">
          Limpar filtros
        </button>
      </div>
    </form>
  </main>


  <script src="../../js/menu/menu-dados.js"></script>
  <script src="../../js/menu/demandas-filtros.js"></script>
</body>

</html>
