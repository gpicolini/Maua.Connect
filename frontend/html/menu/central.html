<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="../../css/menu/central.css">
    <title>Menu | AACD </title>
    <link rel="icon" href="../../imagens/inicio/logos/loguinho-aacd-barra.png">
</head>

<body>

    <div class="background">

        <header class="cabecalho">
            <div class="retanguloFifa">
                <div class="perfilInformacoes">
                    <strong>Olá, [Nome do Usuário]</strong>
                    <span>Medico</span>

                </div>

                <div class="perfilPonta">MD</div>

            </div>

            <div class="acoesPerfil">
                <button class="hamburguer" type="button" aria-label="Abrir Menu">
                    <img src="../../imagens/menu/icones/hamburger.svg" alt="">
                </button>

                <img class="logoInstituicao" src="../../imagens/menu/logos/logo-aacd-branco.png" alt="Logo da AACD">

                <img class="logoMaua" src="../../imagens/menu/logos/logo-maua.svg"
                    alt="Logo do Instituto Mauá de Tecnologia">
            </div>

        </header>

        <nav class="barradomenu" aria-label="Menu principal">
            <button class="aba ativa" type="button">Central</button>
            <button class="aba" type="button">Demandas</button>
            <button class="aba" type="button">Impressoras</button>
            <button class="aba" type="button">Produção</button>
            <button class="aba" type="button">Qualidade</button>
            <button class="aba" type="button">Histórico</button>
        </nav>


        <section class="blocos">
            <div class="bloco blocoPrincipal"></div>
            <div class="bloco blocoInferiorEsquerdo"></div>
            <div class="bloco blocoInferiorCentral"></div>
            <div class="bloco blocoInferiorDireito"></div>
            <div class="bloco blocoInferiorCima"></div>
        </section>

    </div>

    </div>
